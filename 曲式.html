<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>围唱·曲式（直觉与乐句版）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:#0d0f14;color:#ddd;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;height:100%}
canvas{display:block;margin:0 auto;touch-action:none}
</style></head><body><canvas id="c"></canvas>
<script>
// 围唱·曲式（直觉与乐句版）：
// 照梓韬 16:44 玩完 v2 的反馈与横向曲式实验改定：
// 1. 点击/挪动只发纯粹的木质按键声（click），绝不混入旋律音干扰正在转圈的演奏。
// 2. 无需往返屏幕底端手牌栏：音直接长在圈上，点一格再点另一格即可直接挪过去/对调，鼠标不离开圆环。
// 3. 怪直接显示音色与音名；当你选中某一格的音时，场上所有怪直接亮出跟它的关系（金色光环「甜×2」、青圈「稳」、暗灰「闷」），不懂乐理也能一眼看清、边打边听懂。
// 4. 去掉“撞音让怪回血狂暴加速”的负反馈：不合的音打上去只是发闷（0.3伤、无击退），甜（三六度）打上去奏出清亮双音和弦钟声+金色飘字，稳（四五度）奏出踏实低音。
// 5. 升级选“作曲规矩”（级进成弧、三度重唱、五度对答、休止重音）与“音符上限/换音”，把怎么摆旋律直接变成战斗流派。

const W = 800, H = 880, CX = 400, CY = 430;
const BEATS = 8, BEAT = 0.40, SECTION_LOOPS = 6, TOTAL_SECTIONS = 12; // 0.40s 一拍 (150 BPM，一圈 3.2 秒，留足听和挪的时间)
const NAMES = ['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const SCALE = [0,2,4,5,7,9,11];
const CHORDS = [{n:'C',r:0,p:[0,4,7]},{n:'Am',r:9,p:[9,0,4]},{n:'F',r:5,p:[5,9,0]},{n:'G',r:7,p:[7,11,2]},
                {n:'Em',r:4,p:[4,7,11]},{n:'Dm',r:2,p:[2,5,9]},{n:'F',r:5,p:[5,9,0]},{n:'G',r:7,p:[7,11,2]}];
const IN0 = 56, IN1 = 96;
const HALF = Math.PI / 8 * 1.05;
const WAVE_V = 620;
const iv = (a, b) => ((a - b) % 12 + 12) % 12;

function value(pc, mpc){
  const i = iv(pc, mpc);
  if (i===3||i===4||i===8||i===9) return 2;     // 三度六度：甜（清亮和弦共鸣，×2 伤害）
  if (i===0||i===5||i===7) return 1;            // 同音、四五度：稳（×1 伤害）
  return 0.25;                                  // 二度、七度、三全音：闷（无负反馈惩罚，仅微弱刮擦）
}
function kindOf(v){ return v>=2?'甜':v>=1?'稳':'闷'; }
const hue = pc => (pc * 7 % 12) * 30;
const angOf = k => -Math.PI/2 + k * Math.PI/4;
const sectorOf = a => ((Math.round((a + Math.PI/2) / (Math.PI/4)) % 8) + 8) % 8;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; return d; };
function rng32(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const RULES = [
  { id: 'slur',   name: '级进成弧', short: '连弧', col: '#7ef', desc: '相邻两拍是相邻白键(如 C→D)，后一拍滑音连成宽弧，连带再扫前一拍方向' },
  { id: 'third',  name: '三度重唱', short: '重唱', col: '#f9c', desc: '相邻两拍是三度/六度(如 C→E)，后一拍拉着前一拍的音一起重唱(双音和弦波)' },
  { id: 'fifth',  name: '五度对答', short: '对答', col: '#fd6', desc: '正对面两拍(隔4拍)是四五度(如 C↔G)，这一拍响时对面也推一道七成力的应答波' },
  { id: 'accent', name: '休止重音', short: '重音', col: '#fa7', desc: '连续空 2 拍以上后的第一个音是起音重拍(>)：伤害×1.6、击退×2.2、射程+50' },
];
const isStep = (a, b) => { const d = iv(a, b); return d===1||d===2||d===10||d===11; };
const isThird = (a, b) => { const d = iv(a, b); return d===3||d===4||d===8||d===9; };
const isFifth = (a, b) => { const d = iv(a, b); return d===5||d===7; };
function countRestsBefore(inner, k){
  let r = 0;
  for (let d = 1; d <= 7; d++){ if (inner[(k + 8 - d) % 8] == null) r++; else break; }
  return r;
}

// ---------------- 声音（严格区分 UI 点击音、转圈旋律音、命中状态音） ----------------
const A = {
  ctx: null, master: null, muted: false, noiseBuf: null,
  init(){
    if (this.ctx) return;
    const c = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = this.comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    this.master = c.createGain(); this.master.gain.value = 0.78; this.master.connect(comp); comp.connect(c.destination);
    const b = this.noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  },
  ok(){ return this.ctx && !this.muted && !window.TEST; },
  hz: m => 440 * Math.pow(2, (m - 69) / 12),
  env(g, t, a, peak, dec){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); },
  osc(type, f, peak, dec, a = 0.005, lp = 0, t0 = 0){
    const c = this.ctx, t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f; this.env(g, t, a, peak, dec);
    let n = o; if (lp){ const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); n = fl; }
    n.connect(g); g.connect(this.master); o.start(t); o.stop(t + a + dec + 0.05);
  },
  glide(f0, f1, peak, dec){
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + 0.09);
    this.env(g, t, 0.008, peak, dec); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dec + 0.06);
  },
  noise(peak, dec, type, f, q = 1, t0 = 0){
    const c = this.ctx, t = c.currentTime + t0, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; fl.type = type; fl.frequency.value = f; fl.Q.value = q; this.env(g, t, 0.002, peak, dec);
    s.connect(fl); fl.connect(g); g.connect(this.master); s.start(t, Math.random()*0.5); s.stop(t + dec + 0.05);
  },
  // 1. 纯粹的 UI 点击音效（木鱼/机械微动声，绝不带乐音音高，不会跟转圈的歌混在一起）
  uiClick(up = true){
    if (!this.ok()) return;
    this.noise(0.09, 0.022, 'bandpass', up ? 1400 : 950, 3.5);
  },
  // 2. 转圈时你的音符发声
  you(pc, opts = {}){
    if (!this.ok()) return;
    const f = this.hz(72 + pc);
    if (opts.slurFrom != null){
      this.glide(this.hz(72 + opts.slurFrom), f, 0.22, 0.6);
    } else {
      this.osc('triangle', f, opts.accent ? 0.28 : 0.2, 0.55);
    }
    this.osc('sine', f * 2, 0.05, 0.25);
    if (opts.accent) this.osc('triangle', f * 0.5, 0.16, 0.45);
    if (opts.harmony != null){
      const fh = this.hz(72 + opts.harmony);
      this.osc('triangle', fh, 0.15, 0.55, 0.01);
      this.osc('sine', fh * 2, 0.04, 0.25, 0.01);
    }
    if (opts.echoPc != null){
      const fe = this.hz(72 + opts.echoPc);
      this.osc('sine', fe, 0.13, 0.45, 0.01, 0, 0.07);
      this.osc('triangle', fe * 2, 0.04, 0.3, 0.01, 0, 0.07);
    }
  },
  mon(pc, v){ if (!this.ok()) return; this.osc('sawtooth', this.hz(60 + pc), 0.075*v, 0.28, 0.02, 1100); },
  bass(r){ if (!this.ok()) return; this.osc('sine', this.hz(36 + r), 0.26, 0.6, 0.01); this.osc('triangle', this.hz(48 + r), 0.05, 0.3); },
  tick(acc){ if (!this.ok()) return; this.noise(acc ? 0.045 : 0.018, 0.025, 'highpass', 7000); },
  // 3. 波打在怪身上的三种分明听感：甜(清亮双音钟声)、稳(踏实木琴打声)、闷(低闷木头声)
  hitSweet(pc, mpc){
    if (!this.ok()) return;
    this.osc('sine', this.hz(84 + mpc), 0.13, 0.28, 0.003);
    this.osc('sine', this.hz(84 + pc), 0.11, 0.32, 0.025);
  },
  hitSolid(mpc){
    if (!this.ok()) return;
    this.osc('triangle', this.hz(72 + mpc), 0.11, 0.14, 0.003, 1400);
    this.noise(0.05, 0.04, 'bandpass', 800, 2);
  },
  hitDull(){
    if (!this.ok()) return;
    this.noise(0.08, 0.06, 'lowpass', 320, 1);
  },
  pop(pc, sweet){ if (!this.ok()) return; this.osc('sine', this.hz(84 + pc), sweet ? 0.14 : 0.08, 0.45);
    this.osc('sine', this.hz(91 + pc), sweet ? 0.08 : 0.04, 0.35, 0.005, 0, 0.04); },
  lose(pc){ if (!this.ok()) return; const f = this.hz(72 + pc); this.osc('triangle', f, 0.18, 0.7, 0.005, 900); this.osc('triangle', f * 0.94, 0.14, 0.7, 0.005, 700); this.noise(0.08, 0.25, 'lowpass', 500); },
  hurt(){ if (!this.ok()) return; this.osc('sine', 55, 0.5, 0.35, 0.003); this.noise(0.15, 0.2, 'lowpass', 300); },
};

// ---------------- 局面 ----------------
let S;
function reset(seed){
  S = { t: 0, rng: rng32(seed ?? (Date.now() % 1e9)), beatN: 0, nextT: 0.05, sec: 0, chord: CHORDS[0],
    // 开局 3 个音直接摆在 0, 2, 4 拍上，立即可听可见，点一格再点另一格就能挪
    inner: [0, null, 4, null, 7, null, null, null],
    maxNotes: 4, selSlot: null, hoverK: -1, rules: new Set(),
    turnMode: !!window.TURN_MODE, waiting: false, power: 1, mons: [], arcs: [], fx: [],
    slotFlash: Array(8).fill(0), slotLost: Array(8).fill(0), lost: 0,
    hp: 3, maxhp: 3, xp: 0, lvl: 1, need: 2, kills: 0, offer: null, over: false, won: false,
    spawnAcc: 0.6, started: false, paused: false, show: true, msg: '', msgT: 0, nid: 1, range: 295,
    stat: { 甜: 0, 稳: 0, 闷: 0, 连弧: 0, 重唱: 0, 对答: 0, 重音: 0, 震退: 0 },
    song: [], secSong: [], playing: -1 };
}
function say(m, t = 3.2){ S.msg = m; S.msgT = t; }

function inspectBeat(inner, rules, k){
  const pc = inner[k];
  if (pc == null) return null;
  const prevK = (k + 7) % 8, prevPc = inner[prevK];
  const oppK = (k + 4) % 8, oppPc = inner[oppK];
  const accent = rules.has('accent') && countRestsBefore(inner, k) >= 2;
  const slur = rules.has('slur') && prevPc != null && isStep(pc, prevPc);
  const third = rules.has('third') && prevPc != null && isThird(pc, prevPc);
  const fifth = rules.has('fifth') && oppPc != null && isFifth(pc, oppPc);
  return { pc, prevK, prevPc, oppK, oppPc, accent, slur, third, fifth };
}

function playSong(){
  A.init(); if (A.ctx.state === 'suspended') A.ctx.resume();
  const secs = S.secSong.filter(Boolean); if (!secs.length) return;
  let i = 0; const me = S;
  (function next(){
    if (S !== me || i >= secs.length * 8){ me.playing = -1; return; }
    const sec = secs[Math.floor(i / 8)], k = i % 8; me.playing = Math.floor(i / 8);
    if (k === 0 || k === 4) A.bass(sec.r);
    A.tick(k % 4 === 0);
    const info = inspectBeat(sec.inner, me.rules, k);
    if (info){
      A.you(info.pc, {
        accent: info.accent,
        slurFrom: info.slur ? info.prevPc : null,
        harmony: info.third ? info.prevPc : null,
        echoPc: info.fifth ? info.oppPc : null
      });
      me.slotFlash[k] = 1;
      if (info.fifth) me.slotFlash[info.oppK] = 0.6;
    }
    i++; setTimeout(next, BEAT * 1000);
  })();
}

function fireBeat(n){
  const k = n % 8, loop = Math.floor(n / 8), sec = Math.floor(loop / SECTION_LOOPS);
  if (sec >= TOTAL_SECTIONS){ S.over = true; S.won = true; return; }
  if (sec !== S.sec){ S.sec = sec; S.chord = CHORDS[sec % CHORDS.length]; say(`进入第 ${sec + 1} 段：和弦切换为 ${S.chord.n}`, 2.5); }
  A.tick(k % 4 === 0);
  if (k === 0 || k === 4) A.bass(S.chord.r);
  const sing = {};
  for (const m of S.mons) if (sectorOf(m.ang) === k && m.d < 470){
    const v = Math.max(0.15, 1 - m.d / 470); sing[m.pc] = Math.min(1.2, (sing[m.pc] || 0) + v); m.sing = 0.28; }
  for (const pc in sing) A.mon(+pc, sing[pc]);

  if (k === 7) S.secSong[sec] = { r: S.chord.r, inner: S.inner.slice() };
  if (k === 7 && S.turnMode) S.waitNext = true;

  const info = inspectBeat(S.inner, S.rules, k);
  if (info){
    A.you(info.pc, {
      accent: info.accent,
      slurFrom: info.slur ? info.prevPc : null,
      harmony: info.third ? info.prevPc : null,
      echoPc: info.fifth ? info.oppPc : null
    });
    let ang = angOf(k), half = HALF, dmgMul = 1, kbMul = 1, rangeAdd = 0, notes = [info.pc];
    if (info.accent){ dmgMul *= 1.6; kbMul *= 2.2; rangeAdd += 50; S.stat.重音++; }
    if (info.slur){ ang = angOf(k) - Math.PI / 8; half = HALF * 1.95; S.stat.连弧++; }
    if (info.third){ notes = [info.pc, info.prevPc]; S.stat.重唱++; }
    S.arcs.push({ k, ang, half, dmgMul, kbMul, r: 24, max: S.range + rangeAdd, notes, hit: new Set() });
    S.slotFlash[k] = 1;
    if (info.fifth){
      S.stat.对答++;
      S.slotFlash[info.oppK] = Math.max(S.slotFlash[info.oppK], 0.65);
      S.arcs.push({ k: info.oppK, ang: angOf(info.oppK), half: HALF, dmgMul: 0.75, kbMul: 1.0,
        r: 24, max: S.range, notes: [info.oppPc], hit: new Set() });
    }
  }
}

function spawnPack(){
  const R = S.rng, sec = S.sec, ch = S.chord;
  const n = 1 + Math.floor(R() * (1 + Math.min(3, sec / 2)));
  const startIdx = Math.floor(R() * ch.p.length);
  const ang = R() * Math.PI * 2;
  const w = sec >= 4 && R() < 0.3 ? (R() < 0.5 ? -1 : 1) * (0.06 + R()*0.06) : 0;
  for (let i = 0; i < n; i++){
    const pc = (sec >= 1 && i > 0 && R() < 0.65) ? ch.p[(startIdx + i) % ch.p.length] : ch.p[startIdx];
    S.mons.push({ id: S.nid++, pc, ang: ang + (R() - 0.5) * 0.14, d: 450 + i * 28, hp: 2 + sec * 0.42, maxhp: 2 + sec * 0.42,
      v: 22 + Math.min(sec, 3) * 2.0 + R() * 5, w, rad: 12, kb: 0, sing: 0, hitT: 0 });
  }
}

function hitMon(a, m){
  let v = 0, best = 0, mainPc = a.notes[0];
  if (a.notes.length === 1){
    v = best = value(a.notes[0], m.pc);
  } else {
    const v0 = value(a.notes[0], m.pc), v1 = value(a.notes[1], m.pc);
    best = Math.max(v0, v1); const other = Math.min(v0, v1);
    mainPc = v0 >= v1 ? a.notes[0] : a.notes[1];
    v = best + (other >= 1 ? other * 0.5 : 0);
  }
  const x = CX + Math.cos(m.ang) * m.d, y = CY + Math.sin(m.ang) * m.d;
  const kind = kindOf(best); S.stat[kind]++;
  const dmg = v * S.power * a.dmgMul;
  m.hp -= dmg;
  if (best >= 2){
    // 甜（三六度）：大击退 + 清亮双音钟声 + 金色大爆圈与飘字
    m.kb += 32 * v * a.kbMul; m.hitT = 0.25;
    A.hitSweet(mainPc, m.pc);
    S.fx.push({ type: 'spark', x, y, t: 0.45, v: dmg, kind: '甜' });
    S.fx.push({ type: 'text', x, y: y - 14, t: 0.65, txt: '甜 ×2', col: '#ffd866' });
    if (m.hp <= 0 && !m.dead){
      m.sweetDead = true;
      for (const m2 of S.mons){
        if (m2.id !== m.id && !m2.dead && m2.hp > 0 && sectorOf(m2.ang) === sectorOf(m.ang) && Math.abs(m2.d - m.d) < 60){
          m2.hp -= 0.9 * S.power; m2.kb += 30; m2.hitT = 0.25; S.stat.震退++;
          const x2 = CX + Math.cos(m2.ang) * m2.d, y2 = CY + Math.sin(m2.ang) * m2.d;
          S.fx.push({ type: 'link', x0: x, y0: y, x1: x2, y1: y2, t: 0.4, pc: m.pc });
          S.fx.push({ type: 'text', x: x2, y: y2 - 14, t: 0.6, txt: '共振!', col: '#7ef' });
        }
      }
    }
  } else if (best >= 1){
    // 稳（同音/四五度）：中等击退 + 木琴声 + 青白飘字
    m.kb += 22 * v * a.kbMul; m.hitT = 0.18;
    A.hitSolid(m.pc);
    S.fx.push({ type: 'spark', x, y, t: 0.32, v: dmg, kind: '稳' });
    S.fx.push({ type: 'text', x, y: y - 12, t: 0.5, txt: '稳', col: '#cde' });
  } else {
    // 闷（不合的音）：无负反馈狂暴，仅 0.25 微弱刮伤、不击退，提示换音
    m.hitT = 0.1;
    A.hitDull();
    S.fx.push({ type: 'fizz', x, y, t: 0.3 });
    S.fx.push({ type: 'text', x, y: y - 12, t: 0.5, txt: '闷', col: '#889' });
  }
}

function putNoteOnRing(pc){
  const empty = [0,2,4,6,1,3,5,7].find(k => S.inner[k] == null);
  if (empty != null) S.inner[empty] = pc;
}

function makeOffer(){
  const count = S.inner.filter(x => x != null).length;
  if (count < S.maxNotes){
    const have = S.inner.filter(x => x != null);
    const pool = SCALE.filter(x => !have.includes(x));
    const src = pool.length >= 3 ? pool : SCALE.slice();
    const pick = [];
    while (pick.length < 3 && src.length){ const i = Math.floor(S.rng() * src.length); pick.push({ kind: 'note', pc: src.splice(i, 1)[0] }); }
    S.offer = pick; S.offerTitle = `${S.lvl} 级：挑一个新音放进圈里（当前 ${count}/${S.maxNotes} 个音）`;
  } else {
    const availRules = RULES.filter(r => !S.rules.has(r.id));
    const pick = [];
    const pool = availRules.slice();
    while (pick.length < 2 && pool.length){
      const i = Math.floor(S.rng() * pool.length);
      pick.push({ kind: 'rule', rule: pool.splice(i, 1)[0] });
    }
    if (S.maxNotes < 5 && S.lvl >= 5){
      // 稀有投放：多拿第 5 个音的槽位上限
      pick.push({ kind: 'cap', desc: '持有音符上限 +1（可同时在圈上摆 5 个音）' });
    } else {
      const have = S.inner.filter(x => x != null);
      const missing = SCALE.filter(pc => !have.includes(pc));
      const newPc = missing.length ? missing[Math.floor(S.rng() * missing.length)] : null;
      pick.push({ kind: 'power', newPc, desc: newPc != null ? `波伤害 ×1.18，且把圈上第1个音换成 ${NAMES[newPc]}` : `所有波伤害 ×1.20` });
    }
    S.offer = pick; S.offerTitle = `${S.lvl} 级：挑一条作曲规矩（把音摆成对应关系即可生效）`;
  }
  S.offerHover = -1;
}

function applyOffer(item){
  A.uiClick(true);
  if (item.kind === 'note'){
    putNoteOnRing(item.pc);
    say(`放入 ${NAMES[item.pc]}：点任意一格再点另一格就能调位置`, 3.5);
  } else if (item.kind === 'rule'){
    S.rules.add(item.rule.id);
    say(`学会【${item.rule.name}】：${item.rule.desc}`, 4.5);
  } else if (item.kind === 'cap'){
    S.maxNotes++;
    const have = S.inner.filter(x => x != null);
    const missing = SCALE.filter(pc => !have.includes(pc));
    const newPc = missing.length ? missing[0] : 2;
    putNoteOnRing(newPc);
    say(`音符上限升至 ${S.maxNotes} 个，新增了 ${NAMES[newPc]}！`, 3.8);
  } else if (item.kind === 'power'){
    S.power *= item.newPc != null ? 1.18 : 1.20;
    if (item.newPc != null){
      const k = S.inner.findIndex(x => x != null);
      if (k >= 0) S.inner[k] = item.newPc;
      say(`波变强，且换入了 ${NAMES[item.newPc]}`, 3);
    } else {
      say(`波变强（×${S.power.toFixed(2)}）`, 3);
    }
  }
  S.offer = null;
}

function step(dt){
  if (!S.started || S.over || S.offer || S.paused) return;
  S.t += dt;
  if (S.waiting) { S.t -= dt; return; }
  while (S.t >= S.nextT && !S.over){ fireBeat(S.beatN); S.beatN++; S.nextT += BEAT; }
  if (S.over) return;
  const rate = 0.28 + 0.075 * S.sec;
  S.spawnAcc += rate * dt;
  while (S.spawnAcc >= 1){ S.spawnAcc -= 1; spawnPack(); }
  for (const a of S.arcs){
    a.r += WAVE_V * dt;
    for (const m of S.mons){
      if (a.hit.has(m.id) || m.d - m.rad > a.r) continue;
      if (Math.abs(angDiff(m.ang, a.ang)) > a.half + m.rad / Math.max(m.d, 20)) continue;
      a.hit.add(m.id);
      hitMon(a, m);
    }
  }
  S.arcs = S.arcs.filter(a => a.r < a.max);
  for (const m of S.mons){
    m.d += (m.kb * 7 - m.v) * dt; m.kb *= Math.exp(-7 * dt);
    m.ang += m.w * dt; m.sing -= dt; m.hitT -= dt;
    if (m.hp <= 0 && !m.dead){
      m.dead = true; S.kills++; S.xp++;
      S.fx.push({ type: 'pop', x: CX + Math.cos(m.ang)*m.d, y: CY + Math.sin(m.ang)*m.d, t: 0.5, pc: m.pc, sweet: !!m.sweetDead });
      A.pop(m.pc, !!m.sweetDead);
    } else if (m.d < 24 && !m.dead){
      m.dead = true;
      const k = sectorOf(m.ang);
      if (S.inner[k] != null){
        const pc = S.inner[k]; S.inner[k] = null; S.slotLost[k] = 1; S.lost++; A.lose(pc);
        if (S.selSlot === k) S.selSlot = null;
        say('第 ' + (k + 1) + ' 拍的 ' + NAMES[pc] + ' 被撞掉了：那一拍空了，升级可补回', 3);
      } else { S.hp--; S.fx.push({ type: 'hurt', t: 0.4 }); A.hurt(); if (S.hp <= 0) S.over = true; }
    }
  }
  S.mons = S.mons.filter(m => !m.dead);
  for (const f of S.fx) f.t -= dt; S.fx = S.fx.filter(f => f.t > 0);
  for (let k = 0; k < 8; k++){ S.slotFlash[k] = Math.max(0, S.slotFlash[k] - dt * 4); S.slotLost[k] = Math.max(0, S.slotLost[k] - dt * 0.8); }
  if (S.msgT > 0) S.msgT -= dt;
  if (S.waitNext && S.t >= S.nextT - 0.02){ S.waitNext = false; S.waiting = true; S.t = S.nextT - 0.01; }
  if (S.xp >= S.need && !S.over){
    S.xp -= S.need; S.lvl++; S.need = 2 + S.lvl * 2; S.range = Math.min(380, S.range + 10);
    makeOffer();
  }
}

function rotate(d){
  A.uiClick(d > 0);
  const r = S.inner.slice(); for (let k = 0; k < 8; k++) S.inner[(k + d + 8) % 8] = r[k];
  if (S.selSlot != null) S.selSlot = (S.selSlot + d + 8) % 8;
  say(d > 0 ? '整圈顺时针转了一拍' : '整圈逆时针转了一拍', 1.2);
}

// ---------------- 手：直接在圈上点两格挪动/互换，零奔波 ----------------
function slotAt(x, y){
  const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy);
  const k = sectorOf(Math.atan2(dy, dx));
  if (r >= IN0 - 12 && r < IN1 + 18) return { k };
  return null;
}
function offerPos(i, n){ return { x: CX + (i - (n - 1) / 2) * 215, y: CY }; }
function offerAt(x, y){
  if (!S.offer) return -1;
  for (let i = 0; i < S.offer.length; i++){
    const p = offerPos(i, S.offer.length);
    if (Math.abs(x - p.x) < 98 && Math.abs(y - p.y) < 88) return i;
  }
  return -1;
}

function click(x, y, right){
  A.init(); if (A.ctx.state === 'suspended') A.ctx.resume();
  if (!S.started){ S.started = true; A.uiClick(true); return; }
  if (S.over){ reset(); S.started = true; A.uiClick(true); return; }
  if (S.offer){ const i = offerAt(x, y); if (i >= 0) applyOffer(S.offer[i]); return; }
  const s = slotAt(x, y);
  if (s){
    if (right){ S.selSlot = null; A.uiClick(false); return; }
    if (S.selSlot == null){
      if (S.inner[s.k] != null){ S.selSlot = s.k; A.uiClick(true); }
    } else if (S.selSlot === s.k){
      S.selSlot = null; A.uiClick(false);
    } else {
      // 直接把 selSlot 的音和 s.k 互换（或挪到空位），只需在圈上点两下！
      const tmp = S.inner[s.k];
      S.inner[s.k] = S.inner[S.selSlot];
      S.inner[S.selSlot] = tmp;
      S.selSlot = null;
      A.uiClick(false);
    }
    return;
  }
  S.selSlot = null;
}

// ---------------- 画 ----------------
const cv = document.getElementById('c'), g = cv.getContext('2d');
function fit(){
  const dpr = window.devicePixelRatio || 1, s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); cv._s = s;
}
window.addEventListener('resize', fit); fit();
const toXY = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / cv._s, (e.clientY - r.top) / cv._s]; };
cv.addEventListener('pointerdown', e => { const [x, y] = toXY(e); click(x, y, e.button === 2); });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointermove', e => {
  const [x, y] = toXY(e);
  if (S.offer){ S.offerHover = offerAt(x, y); return; }
  const s = slotAt(x, y);
  S.hoverK = s ? s.k : -1;
});
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'h') S.show = !S.show;
  if (k === 'm'){ A.muted = !A.muted; say(A.muted ? '静音了' : '声音回来了'); }
  if (k === 'r'){ const tm = S.turnMode; reset(); S.turnMode = tm; S.started = true; }
  if (k === 'q') rotate(-1);
  if (k === 'e') rotate(1);
  if (k === 't'){ S.turnMode = !S.turnMode; S.waiting = false; S.waitNext = false; say(S.turnMode ? '一圈一回合：每圈放完停住，摆好按空格放下一圈' : '实时：不停', 3); }
  if (k === 'enter' && S.waiting){ S.waiting = false; }
  if (k === ' '){ e.preventDefault(); if (S.over){ if (S.playing < 0) playSong(); } else if (S.waiting) S.waiting = false; else if (!S.turnMode) S.paused = !S.paused; }
});

function annular(r0, r1, a0, a1){ g.beginPath(); g.arc(CX, CY, r1, a0, a1); g.arc(CX, CY, r0, a1, a0, true); g.closePath(); }
function noteColor(pc, l = 60, a = 1){ return `hsla(${hue(pc)},70%,${l}%,${a})`; }

function draw(){
  g.fillStyle = '#0d0f14'; g.fillRect(0, 0, W, H);
  const hurt = S.fx.find(f => f.type === 'hurt');
  if (hurt){ g.fillStyle = `rgba(160,20,30,${hurt.t * 0.5})`; g.fillRect(0, 0, W, H); }
  g.strokeStyle = 'rgba(255,255,255,0.05)'; g.lineWidth = 1;
  for (let k = 0; k < 8; k++){ const a = angOf(k) + Math.PI / 8; g.beginPath(); g.moveTo(CX + Math.cos(a) * IN0, CY + Math.sin(a) * IN0); g.lineTo(CX + Math.cos(a) * 460, CY + Math.sin(a) * 460); g.stroke(); }
  g.beginPath(); g.arc(CX, CY, S.range, 0, Math.PI * 2); g.strokeStyle = 'rgba(255,255,255,0.07)'; g.setLineDash([4, 8]); g.stroke(); g.setLineDash([]);

  // 当前正在拿起的音（或鼠标指着的格子的音）：用于高亮场上哪些怪跟它“甜×2”
  const activePc = S.selSlot != null ? S.inner[S.selSlot] : (S.hoverK >= 0 ? S.inner[S.hoverK] : null);

  // 预览假想移动后的盘面
  const previewInner = S.inner.slice();
  if (S.selSlot != null && S.hoverK >= 0 && S.hoverK !== S.selSlot){
    const tmp = previewInner[S.hoverK];
    previewInner[S.hoverK] = previewInner[S.selSlot];
    previewInner[S.selSlot] = tmp;
  }

  // 波
  for (const a of S.arcs){
    const al = 0.25 + 0.75 * (1 - a.r / a.max);
    const col = a.notes.length === 1 ? noteColor(a.notes[0], 72, al) : `rgba(255,215,245,${al})`;
    g.strokeStyle = col; g.lineWidth = (a.dmgMul > 1.3 ? 8 : 5) + 6 * al; g.lineCap = 'round';
    g.beginPath(); g.arc(CX, CY, a.r, a.ang - a.half, a.ang + a.half); g.stroke();
  }

  // 怪（直接显示音色；若玩家选中/指着某个音，直接标出怪跟它的合度：金环甜×2 / 青圈稳 / 暗闷）
  for (const m of S.mons){
    const x = CX + Math.cos(m.ang) * m.d, y = CY + Math.sin(m.ang) * m.d;
    // 也看怪所在扇区当前摆的音跟它合不合
    const sectorPc = previewInner[sectorOf(m.ang)];
    const refPc = activePc != null ? activePc : sectorPc;
    const rel = refPc != null ? value(refPc, m.pc) : null;

    if (rel === 2){
      g.beginPath(); g.arc(x, y, m.rad + 5, 0, Math.PI * 2);
      g.strokeStyle = 'rgba(255,216,102,0.85)'; g.lineWidth = 2.5; g.stroke();
    } else if (rel === 1){
      g.beginPath(); g.arc(x, y, m.rad + 3, 0, Math.PI * 2);
      g.strokeStyle = 'rgba(180,220,255,0.45)'; g.lineWidth = 1.5; g.stroke();
    }
    if (m.sing > 0){
      g.beginPath(); g.arc(x, y, m.rad + 6 + (0.28 - m.sing) * 28, 0, Math.PI * 2);
      g.strokeStyle = `rgba(220,220,255,${m.sing * 1.6})`; g.lineWidth = 1.5; g.stroke();
    }
    g.beginPath(); g.arc(x, y, m.rad, 0, Math.PI * 2);
    const l = rel != null && rel < 1 ? 26 : 46;
    g.fillStyle = m.hitT > 0 ? '#fff' : (S.show ? noteColor(m.pc, l) : '#7d8796'); g.fill();
    const mo = m.sing > 0 ? 5 : 1.5, fa = m.ang + Math.PI;
    g.fillStyle = '#0d0f14'; g.beginPath(); g.ellipse(x + Math.cos(fa) * 5, y + Math.sin(fa) * 5, 3.2, mo, fa, 0, Math.PI * 2); g.fill();
    if (m.hp < m.maxhp){ g.fillStyle = 'rgba(255,255,255,0.6)'; g.fillRect(x - 10, y - m.rad - 6, 20 * Math.max(0, m.hp / m.maxhp), 2.5); }
    if (S.show){
      g.fillStyle = rel === 2 ? '#ffd866' : '#fff'; g.font = rel === 2 ? 'bold 11px sans-serif' : '10px sans-serif'; g.textAlign = 'center';
      g.fillText(NAMES[m.pc] + (rel === 2 ? '·甜' : ''), x, y - m.rad - 10);
    }
  }

  // 效果与飘字
  for (const f of S.fx){
    if (f.type === 'spark'){ const c = f.kind === '甜' ? '255,215,100' : '210,235,255';
      g.beginPath(); g.arc(f.x, f.y, 6 + (0.45 - f.t) * 65 * Math.min(2, f.v / 2), 0, Math.PI * 2); g.strokeStyle = `rgba(${c},${f.t * 2.2})`; g.lineWidth = f.kind === '甜' ? 3 : 2; g.stroke(); }
    if (f.type === 'fizz'){ g.fillStyle = `rgba(150,150,160,${f.t * 2})`; for (let i = 0; i < 4; i++) g.fillRect(f.x + Math.cos(i*1.6+f.t*9)*9, f.y + Math.sin(i*1.6+f.t*9)*9, 2, 2); }
    if (f.type === 'pop'){ g.beginPath(); g.arc(f.x, f.y, (0.5 - f.t) * (f.sweet ? 95 : 65), 0, Math.PI * 2); g.strokeStyle = noteColor(f.pc, 75, f.t * 1.8); g.lineWidth = f.sweet ? 3 : 2; g.stroke(); }
    if (f.type === 'link'){ g.strokeStyle = noteColor(f.pc, 80, f.t * 2.5); g.lineWidth = 2.5; g.beginPath(); g.moveTo(f.x0, f.y0); g.lineTo(f.x1, f.y1); g.stroke(); }
    if (f.type === 'text'){
      g.fillStyle = f.col; g.font = 'bold 13px sans-serif'; g.textAlign = 'center';
      g.fillText(f.txt, f.x, f.y - (0.65 - f.t) * 28);
    }
  }

  // 1. 圈内五度对答弦
  if (S.rules.has('fifth')){
    for (let k = 0; k < 4; k++){
      const p0 = previewInner[k], p1 = previewInner[k + 4];
      if (p0 != null && p1 != null && isFifth(p0, p1)){
        const a0 = angOf(k), a1 = angOf(k + 4);
        g.strokeStyle = 'rgba(255,220,100,0.7)'; g.lineWidth = 2.5;
        g.beginPath(); g.moveTo(CX + Math.cos(a0) * (IN0 - 4), CY + Math.sin(a0) * (IN0 - 4));
        g.lineTo(CX + Math.cos(a1) * (IN0 - 4), CY + Math.sin(a1) * (IN0 - 4)); g.stroke();
      }
    }
  }

  // 8 拍格子
  const rm = (IN0 + IN1) / 2;
  for (let k = 0; k < 8; k++){
    const a0 = angOf(k) - Math.PI / 8 + 0.03, a1 = angOf(k) + Math.PI / 8 - 0.03, pc = previewInner[k];
    const info = inspectBeat(previewInner, S.rules, k);
    annular(IN0, IN1, a0, a1);
    const isSel = S.selSlot === k, isHov = S.hoverK === k;
    g.fillStyle = pc == null ? (isHov && S.selSlot != null ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.05)') : noteColor(pc, (isSel ? 52 : 35) + S.slotFlash[k] * 28, 0.92);
    g.fill();
    if (pc == null && S.slotLost[k] > 0){ g.fillStyle = `rgba(200,40,40,${S.slotLost[k] * 0.55})`; g.fill(); }
    g.strokeStyle = isSel ? '#fff' : (info && info.accent) ? '#fa7' : (isHov ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.14)');
    g.lineWidth = isSel ? 3 : (info && info.accent) ? 2.5 : 1; g.stroke();

    const a = angOf(k);
    if (pc != null){
      g.fillStyle = '#fff'; g.font = 'bold 15px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText((info && info.accent ? '>' : '') + NAMES[pc], CX + Math.cos(a) * rm, CY + Math.sin(a) * rm);
    }
    if (info && info.slur){
      g.strokeStyle = '#7ef'; g.lineWidth = 3.5;
      g.beginPath(); g.arc(CX, CY, IN1 + 7, angOf(info.prevK), angOf(k)); g.stroke();
    }
    if (info && info.third){
      g.strokeStyle = '#f9c'; g.lineWidth = 3;
      g.beginPath(); g.arc(CX, CY, IN1 + 12, angOf(info.prevK), angOf(k)); g.stroke();
    }
  }

  // 指针与圆心
  const ph = angOf(0) + ((S.t - S.nextT) / BEAT + S.beatN) * Math.PI / 4;
  g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(CX + Math.cos(ph) * 22, CY + Math.sin(ph) * 22); g.lineTo(CX + Math.cos(ph) * (IN1 + 8), CY + Math.sin(ph) * (IN1 + 8)); g.stroke();
  g.beginPath(); g.arc(CX, CY, 15, 0, Math.PI * 2); g.fillStyle = '#eef'; g.fill();

  // 已学会的作曲规矩栏
  if (S.rules.size > 0){
    let rx = 20, ry = 84;
    g.textAlign = 'left'; g.font = '12px sans-serif';
    for (const r of RULES){
      if (!S.rules.has(r.id)) continue;
      g.fillStyle = r.col; g.fillText(`● ${r.name}：${r.desc}`, rx, ry);
      ry += 18;
    }
  }

  // 底部简明操作说明
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(255,255,255,0.5)'; g.font = '13px sans-serif';
  g.fillText(S.selSlot != null ? `已拿起第 ${S.selSlot + 1} 拍的 ${NAMES[S.inner[S.selSlot]]}：点另一格直接挪过去/互换（场上发金光的怪跟它成「甜×2」）` : '操作：点圈上的音再点另一格即可挪动/互换；Q / E 整圈旋转一拍', CX, H - 36);

  // 顶栏
  g.textAlign = 'left'; g.font = '14px sans-serif'; g.fillStyle = '#ccd';
  const sec = Math.floor(S.t / 60), ss = Math.floor(S.t % 60);
  g.fillText('心 ' + '●'.repeat(Math.max(0, S.hp)) + '○'.repeat(Math.max(0, S.maxhp - S.hp)), 20, 26);
  g.fillText(`${sec}:${String(ss).padStart(2, '0')}   第 ${S.sec + 1}/${TOTAL_SECTIONS} 段（和弦 ${S.chord.n}）   ${S.lvl} 级   打散 ${S.kills}`, 20, 50);
  g.fillStyle = 'rgba(255,255,255,0.1)'; g.fillRect(20, 62, 220, 4); g.fillStyle = '#9cf'; g.fillRect(20, 62, 220 * S.xp / S.need, 4);
  g.textAlign = 'right'; g.fillStyle = 'rgba(255,255,255,0.35)'; g.font = '12px sans-serif';
  g.fillText('Q/E 整圈转一拍  T 实时/回合  M 静音  空格 暂停  R 重来', W - 20, 26);
  if (S.turnMode){ g.fillStyle = S.waiting ? '#8f8' : '#aaa'; g.fillText(S.waiting ? '一圈放完了：摆好按空格' : '一圈一回合', W - 20, 68); }
  if (A.muted){ g.fillStyle = '#f88'; g.fillText('静音中', W - 20, 46); }
  if (S.msgT > 0){ g.textAlign = 'center'; g.fillStyle = `rgba(255,240,200,${Math.min(1, S.msgT)})`; g.font = '15px sans-serif'; g.fillText(S.msg, CX, 156); }

  if (!S.started) cover(['围唱·曲式', '', '怪唱着音从四面八方走来，你把音摆在 8 拍的圈上。', '● 直接在圈上点两格就能挪动/对调音符，鼠标不用离开圆环。', '● 怪头顶直接标出跟那一拍合不合：金色「甜×2」(三六度共鸣)、青白「稳」、灰暗「闷」。', '● 升级学会作曲规矩：把音摆成相邻级进、三度重唱、对角五度或长休止，旋律结构就是你的武器。', '', '戴耳机。点一下开始。']);

  if (S.offer){
    g.fillStyle = 'rgba(8,10,14,0.84)'; g.fillRect(0, 0, W, H); g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = '18px sans-serif';
    g.fillText(S.offerTitle, CX, CY - 130);
    S.offer.forEach((item, i) => {
      const p = offerPos(i, S.offer.length), hov = S.offerHover === i;
      g.fillStyle = item.kind === 'note' ? noteColor(item.pc, hov ? 48 : 32) : (hov ? '#2a3242' : '#1b202b');
      g.strokeStyle = item.kind === 'rule' ? item.rule.col : 'rgba(255,255,255,0.28)'; g.lineWidth = hov ? 3 : 1.5;
      g.fillRect(p.x - 95, p.y - 82, 190, 164); g.strokeRect(p.x - 95, p.y - 82, 190, 164);
      if (item.kind === 'note'){
        g.fillStyle = '#fff'; g.font = 'bold 42px sans-serif'; g.fillText(NAMES[item.pc], p.x, p.y - 10);
        g.fillStyle = '#ccd'; g.font = '13px sans-serif'; g.fillText('直接放入圈中空拍', p.x, p.y + 38);
      } else if (item.kind === 'rule'){
        g.fillStyle = item.rule.col; g.font = 'bold 20px sans-serif'; g.fillText(item.rule.name, p.x, p.y - 42);
        g.fillStyle = '#ddd'; g.font = '13px sans-serif'; wrapText(item.rule.desc, p.x, p.y + 4, 168, 20);
      } else if (item.kind === 'cap'){
        g.fillStyle = '#fd6'; g.font = 'bold 20px sans-serif'; g.fillText('音符上限 +1', p.x, p.y - 42);
        g.fillStyle = '#ddd'; g.font = '13px sans-serif'; wrapText(item.desc, p.x, p.y + 4, 168, 20);
      } else {
        g.fillStyle = '#9cf'; g.font = 'bold 19px sans-serif'; g.fillText('强波 / 转调', p.x, p.y - 42);
        g.fillStyle = '#ddd'; g.font = '13px sans-serif'; wrapText(item.desc, p.x, p.y + 4, 168, 20);
      }
    });
  }

  if (S.over){
    const t = `${Math.floor(S.t / 60)}:${String(Math.floor(S.t % 60)).padStart(2, '0')}`, st = S.stat;
    cover([S.won ? '唱完了' : '被围住了', '', `撑了 ${t}，打散 ${S.kills} 只，${S.lvl} 级`,
      `纵向：甜 ${st.甜}  稳 ${st.稳}  闷 ${st.闷}  遗音震退 ${st.震退}`,
      `横向：连弧 ${st.连弧}  重唱 ${st.重唱}  对答 ${st.对答}  重音 ${st.重音}`, '',
      S.playing >= 0 ? `在放你这一局唱的：第 ${S.playing + 1} 段` : '空格：把你这一局守出来的歌连起来听一遍', '点一下或 R 重来']);
  }
}

function wrapText(txt, x, y, maxW, lh){
  let line = '', lines = [];
  for (const ch of txt){
    if (g.measureText(line + ch).width > maxW){ lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  lines.forEach((l, i) => g.fillText(l, x, y + (i - (lines.length - 1) / 2) * lh));
}

function cover(lines){ g.fillStyle = 'rgba(8,10,14,0.84)'; g.fillRect(0, 0, W, H); g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((l, i) => { g.fillStyle = i === 0 ? '#fff' : '#bbc'; g.font = i === 0 ? 'bold 34px sans-serif' : '15px sans-serif'; g.fillText(l, CX, CY - 150 + i * 32); }); }

let last = performance.now();
function frame(now){ const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!window.TEST) step(dt); draw(); requestAnimationFrame(frame); }
reset(); requestAnimationFrame(frame);
</script></body></html>
