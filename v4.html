<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>围唱 四</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:#0d0f14;color:#ddd;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;height:100%}
canvas{display:block;margin:0 auto;touch-action:none}
</style></head><body><canvas id="c"></canvas>
<script>
// 围唱 四：一圈放慢到 4 秒；点击是"咔"，预听是闷的；甜稳没动撞各有声音、画面、字；撞了不发狂；本事跟着音走；偶尔多一个音位。第 11 天 17:00。
// 三：在二上加了格子本事（音满了以后升级拿）和两种怪（硬壳、走调）。吹万，第 11 天 16:50。
// 二：手上的音有上限（4 个），整圈能转（Q/E），T 切"一圈一回合"。
// 怪在哪个方向，就在哪一拍唱；你那一格也在那一拍唱、朝那边推一道波。合上才打得动。
const W = 800, H = 880, CX = 400, CY = 410;
const BEATS = 8, BEAT = 0.5, SECTION_LOOPS = 8, TOTAL_SECTIONS = 12;
const NAMES = ['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const SCALE = [0,2,4,5,7,9,11];
const CHORDS = [{n:'C',r:0,p:[0,4,7]},{n:'Am',r:9,p:[9,0,4]},{n:'F',r:5,p:[5,9,0]},{n:'G',r:7,p:[7,11,2]},
                {n:'Em',r:4,p:[4,7,11]},{n:'Dm',r:2,p:[2,5,9]},{n:'F',r:5,p:[5,9,0]},{n:'G',r:7,p:[7,11,2]}];
const IN0 = 50, IN1 = 84, OUT0 = 88, OUT1 = 120;   // 两圈格子
const HALF = Math.PI / 8 * 1.05;                     // 一道波的半宽
const WAVE_V = 650;
const MAXN0 = 4, MAXN_TOP = 6;   // 一开始手上最多几个音；多一个音位最多到 6
const SLOW = 0.6;   // 一拍从 0.3 秒放慢到 0.5 秒，怪也跟着慢，每一圈里的局面跟三一样
const iv = (a, b) => ((a - b) % 12 + 12) % 12;
function value(pc, mpc){            // 你的音打在它的音上值多少
  const i = iv(pc, mpc);
  if (i===3||i===4||i===8||i===9) return 2;     // 三度六度：甜
  if (i===0||i===5||i===7) return 1;            // 同音、四五度：稳
  if (i===2||i===10) return 0;                  // 大二小七：软，穿过去什么也没有
  return -1;                                    // 小二、三全音、大七：撞
}
function hitVal(pc, m){              // 硬壳：甜照常，稳的只剩一半
  const x = value(pc, m.pc); return (m.kind === '壳' && x >= 0 && x < 2) ? x * 0.5 : x; }
const ABIL = {
  延音: '这一拍的音|拖到下一拍再响一遍|（六成力）|跟下一拍的音不合|就会撞',
  重音: '这一拍的波|伤害多六成',
  回响: '这一拍打死的怪|死时用自己的音|唱一圈|打它旁边的怪',
  宽:   '这一拍的波|宽一半',
};
const ABIL_SHORT = { 延音: '延', 重音: '重', 回响: '回', 宽: '宽' };
function kindOf(v){ return v>=2?'甜':v>=1?'稳':v>=0?'软':'撞'; }
const hue = pc => (pc * 7 % 12) * 30;           // 五度圈排颜色：挨着的颜色是五度
const angOf = k => -Math.PI/2 + k * Math.PI/4;
const sectorOf = a => ((Math.round((a + Math.PI/2) / (Math.PI/4)) % 8) + 8) % 8;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; return d; };
function rng32(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------- 声音 ----------------
const A = {
  ctx: null, master: null, muted: false, noiseBuf: null,
  init(){
    if (this.ctx) return;
    const c = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = this.comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    this.master = c.createGain(); this.master.gain.value = 0.75; this.master.connect(comp); comp.connect(c.destination);
    const b = this.noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  },
  ok(){ return this.ctx && !this.muted && !window.TEST; },
  hz: m => 440 * Math.pow(2, (m - 69) / 12),
  env(g, t, a, peak, dec){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); },
  osc(type, f, peak, dec, a = 0.005, lp = 0, t0 = 0){
    const c = this.ctx, t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f; this.env(g, t, a, peak, dec);
    let n = o; if (lp){ const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); n = fl; }
    n.connect(g); g.connect(this.master); o.start(t); o.stop(t + a + dec + 0.05);
  },
  noise(peak, dec, type, f, q = 1){
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; fl.type = type; fl.frequency.value = f; fl.Q.value = q; this.env(g, t, 0.002, peak, dec);
    s.connect(fl); fl.connect(g); g.connect(this.master); s.start(t, Math.random()*0.5); s.stop(t + dec + 0.05);
  },
  you(pc, n){ if (!this.ok()) return; const f = this.hz(72 + pc), k = n > 1 ? 0.7 : 1;
    this.osc('triangle', f, 0.2*k, 0.55); this.osc('sine', f*2, 0.05*k, 0.25); },
  mon(pc, v){ if (!this.ok()) return; this.osc('sawtooth', this.hz(60 + pc), 0.09*v, 0.32, 0.025, 1200); },
  bass(r){ if (!this.ok()) return; this.osc('sine', this.hz(36 + r), 0.28, 0.6, 0.01); this.osc('triangle', this.hz(48 + r), 0.05, 0.3); },
  tick(acc){ if (!this.ok()) return; this.noise(acc ? 0.05 : 0.02, 0.03, 'highpass', 7000); },
  spark(v){ if (!this.ok()) return; this.osc('sine', 1800 + Math.random()*600, 0.02*v, 0.08); },
  clash(){ if (!this.ok()) return; this.noise(0.28, 0.12, 'bandpass', 1800, 0.8); this.noise(0.18, 0.2, 'lowpass', 300); },   // 撞：一声噪的咔嚓，没有音高，跟怪的锯齿分开
  pop(pc){ if (!this.ok()) return; const L = (S.nextT - S.t) > 0.03 ? S.nextT - S.t : 0;   // 打散的那一声等到下一拍，跟下一个音一起响
    this.osc('sine', this.hz(72 + pc), 0.05, 0.5, 0.005, 0, L); this.osc('sine', this.hz(79 + pc), 0.025, 0.4, 0.005, 0, L); },
  lose(pc){ if (!this.ok()) return; const f = this.hz(72 + pc); this.osc('triangle', f, 0.18, 0.7, 0.005, 900); this.osc('triangle', f * 0.94, 0.14, 0.7, 0.005, 700); this.noise(0.08, 0.25, 'lowpass', 500); },
  hurt(){ if (!this.ok()) return; this.osc('sine', 55, 0.5, 0.35, 0.003); this.noise(0.15, 0.2, 'lowpass', 300); },
  sus(pc){ if (!this.ok()) return; this.osc('sine', this.hz(72 + pc), 0.1, 0.5, 0.04); },
  preview(pc){ if (!this.ok()) return; this.osc('sine', this.hz(72 + pc), 0.07, 0.35, 0.02, 600); },   // 预听：闷、轻，像隔着墙
  click(up){ if (!this.ok()) return; this.noise(0.12, 0.025, 'bandpass', up ? 3200 : 2200, 6); },   // 点击：通用的"咔"
  sweet(pc){ if (!this.ok()) return; const f = this.hz(84 + (pc ?? 0)), L = this.lag || 0; this.osc('sine', f / 2, 0.05, 0.25, 0.004, 0, L); this.osc('sine', f, 0.012, 0.18, 0.004, 0, L); },   // 像木琴：跟打中的那个音同音高、短、轻   // 甜：跟着打中的那个音，高八度，轻，不另起音高
  steady(){ if (!this.ok()) return; this.osc('sine', 180, 0.22, 0.14, 0.003, 0, this.lag || 0); },
  puff(){ if (!this.ok()) return; this.noise(0.12, 0.1, 'lowpass', 1200); },
};

// ---------------- 局面 ----------------
let S;
function reset(seed){
  S = { t: 0, rng: rng32(seed ?? (Date.now() % 1e9)), beatN: 0, nextT: 0.05, sec: 0, chord: CHORDS[0],
    inner: Array(8).fill(null), outer: Array(8).fill(null), outerOpen: false,
    hand: [0, 4, 7], handAb: [null, null, null], sel: null, innerAb: Array(8).fill(null), maxn: MAXN0, abHand: null, offerKind: 'note', echoes: [], turnMode: !!window.TURN_MODE, waiting: false, power: 1, mons: [], arcs: [], fx: [], slotFlash: Array(8).fill(0), slotLost: Array(8).fill(0), lost: 0,
    hp: 3, maxhp: 3, xp: 0, lvl: 1, need: 2, kills: 0, offer: null, over: false, won: false,
    spawnAcc: 0.6, started: false, paused: false, show: false, msg: '', msgT: 0, nid: 1, range: 290,
    stat: { 甜: 0, 稳: 0, 软: 0, 撞: 0 }, song: [], secSong: [], playing: -1 };
}
function say(m, t = 3){ S.msg = m; S.msgT = t; }
// 一局打完：每一段最后那一圈，按段连起来放一遍，就是你这一局唱的歌
function playSong(){
  A.init(); if (A.ctx.state === 'suspended') A.ctx.resume();
  const secs = S.secSong.filter(Boolean); if (!secs.length) return;
  let i = 0; const me = S;
  (function next(){
    if (S !== me || i >= secs.length * 8){ me.playing = -1; return; }
    const sec = secs[Math.floor(i / 8)], k = i % 8; me.playing = Math.floor(i / 8);
    if (k === 0 || k === 4) A.bass(sec.r);
    A.tick(k % 4 === 0);
    const ns = [sec.inner[k], sec.outer[k]].filter(x => x != null); ns.forEach(pc => A.you(pc, ns.length));
    me.slotFlash[k] = 1; i++; setTimeout(next, BEAT * 1000);
  })();
}

function fireBeat(n){
  const k = n % 8, loop = Math.floor(n / 8), sec = Math.floor(loop / SECTION_LOOPS);
  if (sec >= TOTAL_SECTIONS){ S.over = true; S.won = true; return; }
  if (sec !== S.sec){ S.sec = sec; S.chord = CHORDS[sec % CHORDS.length]; }
  A.tick(k % 4 === 0);
  if (k === 0 || k === 4) A.bass(S.chord.r);
  // 这一拍方向上的怪唱
  const sing = {};
  for (const m of S.mons) if (sectorOf(m.ang) === k && m.d < 470){
    const v = Math.max(0.15, 1 - m.d / 470); sing[m.pc] = Math.min(1.2, (sing[m.pc] || 0) + v); m.sing = 0.25; }
  for (const pc in sing) A.mon(+pc, sing[pc]);
  // 你的那一格
  const notes = [S.inner[k], S.outer[k]].filter(x => x != null);
  const kp = (k + 7) % 8, sus = (S.innerAb[kp] === '延音' && S.inner[kp] != null) ? S.inner[kp] : null;
  S.song.push(notes.slice());
  if (k === 7) S.secSong[sec] = { r: S.chord.r, inner: S.inner.slice(), outer: S.outer.slice() };
  if (k === 7 && S.turnMode) S.waitNext = true;
  if (notes.length || sus != null){
    notes.forEach(pc => A.you(pc, notes.length));
    if (sus != null) A.sus(sus);
    const all = sus != null ? notes.concat([sus]) : notes;
    let self = 1; for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) if (value(all[i], all[j]) < 0) self = 0.5;
    if (!notes.length) self *= 0.6;
    const ab = S.innerAb[k];
    const arcObj = { k, ang: angOf(k), r: 24, max: S.range, notes: all, hit: new Set(), blocks: [], self, abil: ab, heard: {}, half: ab === '宽' ? HALF * 1.5 : HALF, sus: sus != null };
    S.arcs.push(arcObj);
    // 这一拍会打中什么，就在这一拍、跟你的音同时响出来：耳朵听到的就是这一下会怎样
    { const ms = S.mons.filter(m => sectorOf(m.ang) === k && m.d < S.range + 20); let best = -9; for (const m of ms){ let v = 0; for (const pc of all) v = Math.max(v, hitVal(pc, m)); best = Math.max(best, v); }
      A.lag = 0; if (ms.length){ if (best >= 2){ A.sweet(all[0]); arcObj.heard['甜'] = 1; arcObj.fb = 1; } else if (best >= 0.5){ A.steady(); arcObj.heard['稳'] = 1; arcObj.fb = 1; } } }
    S.slotFlash[k] = 1;
  }
}

function spawnPack(){
  const R = S.rng, sec = S.sec, ch = S.chord;
  const n = 1 + Math.floor(R() * (1 + Math.min(3, sec / 2)));
  const pc = ch.p[Math.floor(R() * ch.p.length)];
  const ang = R() * Math.PI * 2;
  const w = sec >= 4 && R() < 0.3 ? (R() < 0.5 ? -1 : 1) * (0.06 + R()*0.06) * SLOW : 0;
  let kind = null; if (!window.NO_KINDS && sec >= 2){ const r = R(); if (r < 0.14) kind = '壳'; else if (r < 0.34) kind = '走'; if (window.ONLY_KIND && kind && kind !== window.ONLY_KIND) kind = null; }
  for (let i = 0; i < n; i++){
    S.mons.push({ id: S.nid++, pc, ang: ang + (R() - 0.5) * 0.14, d: 450 + i * 24, hp: 2 + sec * 0.4, maxhp: 2 + sec * 0.4,
      v: (24 + Math.min(sec, 3) * 2.2 + R() * 6) * SLOW, w, rad: 11, kb: 0, rage: 0, sing: 0, hitT: 0, kind });
  }
}

function hitMon(a, m){
  let v = 0, best = -9;
  for (const pc of a.notes){ const x = hitVal(pc, m); v += x; best = Math.max(best, x); }
  v *= a.self;
  const x = CX + Math.cos(m.ang) * m.d, y = CY + Math.sin(m.ang) * m.d;
  if (v <= 0.3 && v >= 0){ S.stat.软++; S.fx.push({ type: 'fizz', x, y, t: 0.4 }); S.fx.push({ type: 'word', x, y, t: 0.7, w: '没动', c: '160,160,170' }); hear(a, '没动'); return; }
  if (v < 0){
    a.blocks.push({ ang: m.ang, w: Math.atan2(m.rad * 1.8, m.d) });
    S.stat.撞++;
    S.fx.push({ type: 'shatter', x, y, t: 0.45, ang: a.ang }); S.fx.push({ type: 'word', x, y, t: 0.8, w: '撞', c: '255,90,90' });
    hear(a, '撞');
  } else {
    v *= S.power * (a.abil === '重音' ? 1.6 : 1); m.hp -= v; m.kb += 26 * v; m.hitT = 0.2; S.stat[kindOf(best)]++;
    if (a.abil === '回响' && m.hp <= 0) m.echo = true;
    if (m.kind === '走') detune(m);
    const kd = best >= 2 ? '甜' : '稳';
    S.fx.push({ type: 'spark', x, y, t: kd === '甜' ? 0.5 : 0.35, v, kind: kd });
    S.fx.push({ type: 'word', x, y, t: 0.7, w: kd, c: kd === '甜' ? '255,215,120' : '230,240,255' });
    hear(a, kd);
  }
}

function hear(a, kd){   // 一道波每种反馈只响一次；甜、稳的声音等到下一个半拍再响，跟旋律对齐，不在空拍里单独啾一下
  if (a.heard[kd]) return; a.heard[kd] = 1;
  if ((kd === '甜' || kd === '稳') && a.fb) return;   // 这一拍已经在音头上响过了，波走到时不再响一次
  A.lag = 0;
  if (kd === '甜') A.sweet(a.notes[0]); else if (kd === '稳') A.steady(); else if (kd === '没动') A.puff(); else A.clash(); }
function detune(m){   // 走调：挨一下，自己的音往上走一个音阶
  const i = SCALE.indexOf(m.pc); m.pc = SCALE[((i < 0 ? 0 : i) + 1) % 7]; }
function echoAt(x, y, pc, from){   // 死掉的怪用自己的音唱一圈，打旁边的
  S.fx.push({ type: 'echo', x, y, t: 0.4, pc }); A.pop(pc);
  for (const o of S.mons){ if (o.dead || o.id === from || o.hp <= 0) continue;
    const ox = CX + Math.cos(o.ang) * o.d, oy = CY + Math.sin(o.ang) * o.d;
    if (Math.hypot(ox - x, oy - y) > 80) continue;
    const v = hitVal(pc, o);
    if (v > 0){ const d = v * S.power * 0.8; o.hp -= d; o.kb += 20 * d; o.hitT = 0.2; S.stat.回 = (S.stat.回 || 0) + 1; if (o.hp <= 0) o.echo = true; if (o.kind === '走') detune(o); }
    else if (v < 0){ S.fx.push({ type: 'shatter', x: ox, y: oy, t: 0.3, ang: 0 }); }
  } }
function step(dt){
  if (!S.started || S.over || S.offer || S.abHand || S.paused) return;
  S.t += dt;
  if (S.waiting) { S.t -= dt; return; }
  while (S.t >= S.nextT && !S.over){ fireBeat(S.beatN); S.beatN++; S.nextT += BEAT; }
  if (S.over) return;
  // 出怪
  const rate = (0.32 + 0.085 * S.sec) * SLOW;
  S.spawnAcc += rate * dt;
  while (S.spawnAcc >= 1){ S.spawnAcc -= 1; spawnPack(); }
  // 波
  for (const a of S.arcs){
    a.r += WAVE_V * dt;
    for (const m of S.mons){
      if (a.hit.has(m.id) || m.d - m.rad > a.r) continue;
      if (Math.abs(angDiff(m.ang, a.ang)) > a.half + m.rad / Math.max(m.d, 20)) continue;
      a.hit.add(m.id);
      if (a.blocks.some(b => Math.abs(angDiff(m.ang, b.ang)) < b.w)) continue;
      hitMon(a, m);
    }
  }
  S.arcs = S.arcs.filter(a => a.r < a.max);
  // 怪
  for (const m of S.mons){
    const sp = m.v * (m.rage > 0 ? 1.75 : 1);
    m.d += (m.kb * 7 - sp) * dt; m.kb *= Math.exp(-7 * dt);
    m.ang += m.w * dt; m.rage -= dt; m.sing -= dt; m.hitT -= dt;
    if (m.hp <= 0 && !m.dead){ m.dead = true; S.kills++; S.xp++;
      if (m.echo) S.echoes.push({ x: CX + Math.cos(m.ang)*m.d, y: CY + Math.sin(m.ang)*m.d, pc: m.pc, t: 0.12, from: m.id });
      S.fx.push({ type: 'pop', x: CX + Math.cos(m.ang)*m.d, y: CY + Math.sin(m.ang)*m.d, t: 0.5, pc: m.pc }); A.pop(m.pc); }
    else if (m.d < 22 && !m.dead){ m.dead = true;
      // 撞到你身上：先吃掉它那个方向那一拍的音（外圈先、再内圈）；那一拍空着，才伤到你
      const k = sectorOf(m.ang), ring = S.outer[k] != null ? 'outer' : (S.inner[k] != null ? 'inner' : null);
      if (ring){ const pc = S[ring][k]; S[ring][k] = null; if (ring === 'inner') S.innerAb[k] = null; S.slotLost[k] = 1; S.lost++; A.lose(pc);
        say('第 ' + (k + 1) + ' 拍的 ' + NAMES[pc] + ' 被它吃掉了：那一拍空了，你听得见', 3); }
      else { S.hp--; S.fx.push({ type: 'hurt', t: 0.4 }); A.hurt(); if (S.hp <= 0){ S.over = true; } } }
  }
  S.mons = S.mons.filter(m => !m.dead);
  for (const e of S.echoes){ e.t -= dt; if (e.t <= 0 && !e.done){ e.done = true; echoAt(e.x, e.y, e.pc, e.from); } }
  S.echoes = S.echoes.filter(e => !e.done);
  for (const f of S.fx) f.t -= dt; S.fx = S.fx.filter(f => f.t > 0);
  for (let k = 0; k < 8; k++){ S.slotFlash[k] = Math.max(0, S.slotFlash[k] - dt * 4); S.slotLost[k] = Math.max(0, S.slotLost[k] - dt * 0.8); }
  if (S.msgT > 0) S.msgT -= dt;
  if (S.waitNext && S.t >= S.nextT - 0.02){ S.waitNext = false; S.waiting = true; S.t = S.nextT - 0.01; }
  // 升级
  if (S.xp >= S.need && !S.over){
    S.xp -= S.need; S.lvl++; S.need = 2 + S.lvl * 2; S.range = Math.min(380, S.range + 10);
    const total = S.inner.filter(x => x != null).length + S.hand.length;
    if (total < S.maxn){
      const pool = SCALE.slice(); const pick = [];
      while (pick.length < 3){ const i = Math.floor(S.rng() * pool.length); pick.push(pool.splice(i, 1)[0]); }
      S.offer = pick; S.offerKind = 'note'; S.offerHover = -1;
    } else if (window.NO_ABIL){ S.power *= 1.15; say('音已经满 ' + S.maxn + ' 个了：这一级是波变强（×' + S.power.toFixed(2) + '）', 3); }
    else { const pool = Object.keys(ABIL), pick = [];
      while (pick.length < 2){ const i = Math.floor(S.rng() * pool.length); pick.push(pool.splice(i, 1)[0]); }
      const have = S.inner.concat(S.hand).filter(x => x != null), np = SCALE.filter(x => !have.includes(x));
      if (S.maxn < MAXN_TOP && S.rng() < 0.18) pick.push({ more: 1 });
      else pick.push({ swap: np[Math.floor(S.rng() * np.length)] });
      S.power *= 1.15; S.offer = pick; S.offerKind = 'abil'; S.offerHover = -1; }
  }
}

function rotate(d){   // 整圈一起转：旋律原样，换了朝向
  const r = S.inner.slice(), ra = S.innerAb.slice(); for (let k = 0; k < 8; k++){ S.inner[(k + d + 8) % 8] = r[k]; S.innerAb[(k + d + 8) % 8] = ra[k]; } A.click(1);
  say(d > 0 ? '整圈顺时针转了一拍' : '整圈逆时针转了一拍', 1.2);
}
// ---------------- 手：点 ----------------
function slotAt(x, y){
  const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy);
  const k = sectorOf(Math.atan2(dy, dx));
  if (r >= IN0 && r < IN1 + 2) return { ring: 'inner', k };
  if (S.outerOpen && r >= OUT0 - 2 && r < OUT1) return { ring: 'outer', k };
  return null;
}
const HAND_Y = 832;
function handPos(i){ const n = Math.max(S.hand.length, 1); return { x: CX + (i - (n - 1) / 2) * 56, y: HAND_Y }; }
function handAt(x, y){ for (let i = 0; i < S.hand.length; i++){ const p = handPos(i); if (Math.hypot(x - p.x, y - p.y) < 24) return i; } return -1; }
function offerPos(i){ return { x: CX + (i - 1) * 150, y: CY }; }
function offerAt(x, y){ if (!S.offer) return -1; for (let i = 0; i < 3; i++){ const p = offerPos(i); if (Math.abs(x - p.x) < 60 && Math.abs(y - p.y) < 75) return i; } return -1; }

function click(x, y, right){
  A.init(); if (A.ctx.state === 'suspended') A.ctx.resume();
  if (!S.started){ S.started = true; return; }
  if (S.over){ reset(); S.started = true; return; }
  if (S.offer){ const i = offerAt(x, y); if (i >= 0){
      A.click(1);
      if (S.offerKind === 'abil' && S.offer[i].more){ S.maxn++; const pool = SCALE.filter(x => !S.inner.concat(S.hand).includes(x)); S.hand.push(pool[Math.floor(S.rng() * pool.length)]); S.handAb.push(null);
        say('多了一个音位（现在最多 ' + S.maxn + ' 个），手里多了一个音', 3); }
      else if (S.offerKind === 'abil'){ S.abHand = S.offer[i]; say(S.abHand.swap != null ? '点一个音，把它换成 ' + NAMES[S.abHand.swap] + '（它身上的本事留着）' : '点一个音（圈上的、手里的都行），让它带上「' + S.abHand + '」', 30); }
      else { S.hand.push(S.offer[i]); S.handAb.push(null); }
      S.offer = null; } return; }
  if (S.abHand){ const s = slotAt(x, y), hh = handAt(x, y);
    const at = (s && s.ring === 'inner' && S.inner[s.k] != null) ? ['inner', s.k] : (hh >= 0 ? ['hand', hh] : null);
    if (!at) return;
    const arr = at[0] === 'inner' ? S.inner : S.hand, abArr = at[0] === 'inner' ? S.innerAb : S.handAb, j = at[1];
    A.click(1);
    if (S.abHand.swap != null){ const old = arr[j]; arr[j] = S.abHand.swap; say(NAMES[old] + ' 换成了 ' + NAMES[S.abHand.swap], 3); }
    else { abArr[j] = S.abHand; say(NAMES[arr[j]] + ' 带上了「' + S.abHand + '」：挪到哪，本事跟到哪', 3); }
    S.abHand = null; return; }
  const h = handAt(x, y);
  if (h >= 0){ S.sel = S.sel === h ? null : h; A.click(0); return; }
  const s = slotAt(x, y);
  if (s){
    const ring = S[s.ring], cur = ring[s.k];
    const AB = S.innerAb;
    if (right){ if (cur != null){ S.hand.push(cur); S.handAb.push(AB[s.k]); ring[s.k] = null; AB[s.k] = null; A.click(0); } S.sel = null; return; }
    if (S.sel != null){ const pc = S.hand[S.sel], ab = S.handAb[S.sel], cab = AB[s.k]; S.hand.splice(S.sel, 1); S.handAb.splice(S.sel, 1);
      ring[s.k] = pc; AB[s.k] = ab; if (cur != null){ S.hand.push(cur); S.handAb.push(cab); } S.sel = null; A.click(1); }
    else if (cur != null){ S.hand.push(cur); S.handAb.push(AB[s.k]); ring[s.k] = null; AB[s.k] = null; S.sel = S.hand.length - 1; A.click(0); }
    return;
  }
  S.sel = null;
}

// ---------------- 画 ----------------
const cv = document.getElementById('c'), g = cv.getContext('2d');
function fit(){
  const dpr = window.devicePixelRatio || 1, s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); cv._s = s;
}
window.addEventListener('resize', fit); fit();
const toXY = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / cv._s, (e.clientY - r.top) / cv._s]; };
cv.addEventListener('pointerdown', e => { const [x, y] = toXY(e); click(x, y, e.button === 2); });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointermove', e => { const [x, y] = toXY(e); { const ss = slotAt(x, y); S.hoverSlot = ss && ss.ring === 'inner' ? ss.k : -1; }
  if (S.offer){ const i = offerAt(x, y); if (i !== S.offerHover){ S.offerHover = i; if (i >= 0){ const o = S.offer[i]; if (S.offerKind === 'note') A.preview(o); else if (o.swap != null) A.preview(o.swap); } } return; }
  // 手里拿着一个音、指到一格上：把它跟那个方向最近的那只怪一起轻轻唱一下，先听再放
  const s = S.sel != null ? slotAt(x, y) : null, key = s ? s.k : -1;
  if (key !== S.hoverK){ S.hoverK = key; if (s){ A.preview(S.hand[S.sel]);
    const ms = S.mons.filter(m => sectorOf(m.ang) === s.k && m.d < 470).sort((a, b) => a.d - b.d);
    if (ms.length) A.mon(ms[0].pc, 0.8); } } });
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'h') S.show = !S.show;
  if (k === 'm'){ A.muted = !A.muted; say(A.muted ? '静音了：现在只靠眼睛，还打得过吗' : '声音回来了'); }
  if (k === 'r'){ const tm = S.turnMode; reset(); S.turnMode = tm; S.started = true; }
  if (k === 'q') rotate(-1);
  if (k === 'e') rotate(1);
  if (k === 't'){ S.turnMode = !S.turnMode; S.waiting = false; S.waitNext = false; say(S.turnMode ? '一圈一回合：每圈放完停住，摆好按空格放下一圈' : '实时：不停', 3); }
  if (k === 'enter' && S.waiting){ S.waiting = false; }
  if (k === ' '){ e.preventDefault(); if (S.over){ if (S.playing < 0) playSong(); } else if (S.waiting) S.waiting = false; else if (!S.turnMode) S.paused = !S.paused; }
});

function annular(r0, r1, a0, a1){ g.beginPath(); g.arc(CX, CY, r1, a0, a1); g.arc(CX, CY, r0, a1, a0, true); g.closePath(); }
function noteColor(pc, l = 60, a = 1){ return `hsla(${hue(pc)},70%,${l}%,${a})`; }

function draw(){

  g.strokeStyle = 'rgba(255,255,255,0.04)'; g.lineWidth = 1;
  for (let k = 0; k < 8; k++){ const a = angOf(k) + Math.PI / 8; g.beginPath(); g.moveTo(CX + Math.cos(a) * IN0, CY + Math.sin(a) * IN0); g.lineTo(CX + Math.cos(a) * 460, CY + Math.sin(a) * 460); g.stroke(); }

  }

  for (const f of S.fx){

      g.fillStyle = S.offerHover === i ? '#3a3f4c' : '#262a33'; g.fillRect(p.x - 65, p.y - 75, 130, 150);
      g.fillStyle = '#fd8'; g.font = 'bold 28px sans-serif'; g.fillText(n, p.x, p.y - 40);
      g.fillStyle = '#ccd'; g.font = '12px sans-serif'; ABIL[n].split('|').forEach((l, j) => g.fillText(l, p.x, p.y - 5 + j * 17)); }); }
  else if (S.offer){ g.fillStyle = 'rgba(8,10,14,0.75)'; g.fillRect(0, 0, W, H); g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = '18px sans-serif';
    g.fillText(`${S.lvl} 级：挑一个音（指上去听一下）`, CX, CY - 120);
    S.offer.forEach((pc, i) => { const p = offerPos(i); g.fillStyle = noteColor(pc, S.offerHover === i ? 50 : 35); g.fillRect(p.x - 55, p.y - 70, 110, 140);
      g.fillStyle = '#fff'; g.font = 'bold 40px sans-serif'; g.fillText(NAMES[pc], p.x, p.y); }); }
  if (S.abHand){ g.textAlign = 'center'; g.fillStyle = '#fd8'; g.font = '16px sans-serif'; g.fillText(S.abHand.swap != null ? '换成 ' + NAMES[S.abHand.swap] + '：点一个音（圈上的、手里的都行）' : '「' + S.abHand + '」：点一个音（圈上的、手里的都行）带上它', CX, HAND_Y - 70); }
  if (S.over){ const t = `${Math.floor(S.t / 60)}:${String(Math.floor(S.t % 60)).padStart(2, '0')}`, st = S.stat;
    cover([S.won ? '唱完了' : '被围住了', '', `撑了 ${t}，打散 ${S.kills} 只，${S.lvl} 级`, `波打上去：甜 ${st.甜}  稳 ${st.稳}  软 ${st.软}  撞 ${st.撞}`, '', S.playing >= 0 ? `在放你这一局唱的：第 ${S.playing + 1} 段` : '空格：把你这一局唱的连起来听一遍（每段最后那一圈）', '点一下或 R 重来']); }
}
function cover(lines){ g.fillStyle = 'rgba(8,10,14,0.82)'; g.fillRect(0, 0, W, H); g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((l, i) => { g.fillStyle = i === 0 ? '#fff' : '#bbc'; g.font = i === 0 ? 'bold 34px sans-serif' : '16px sans-serif'; g.fillText(l, CX, CY - 150 + i * 32); }); }

let last = performance.now();
function frame(now){ const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!window.TEST) step(dt); draw(); requestAnimationFrame(frame); }
reset(); requestAnimationFrame(frame);
</script></body></html>
